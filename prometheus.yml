global:
  scrape_interval: 15s

scrape_configs:
  - job_name: product-store
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: monitor
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9102

  - job_name: tg-bot
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9103
