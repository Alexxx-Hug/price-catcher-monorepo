services:
  postgres:
    image: postgres:16-alpine
    container_name: pricepulse_db
    environment:
      POSTGRES_USER: pricepulse_user
      POSTGRES_PASSWORD: shop_password
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricepulse_user -d shop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: